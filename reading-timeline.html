<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reading Timeline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%231e2028'/><rect x='4' y='8' width='6' height='16' rx='1' fill='%23e03030'/><rect x='11' y='10' width='5' height='14' rx='1' fill='%23e07820'/><rect x='17' y='7' width='7' height='17' rx='1' fill='%232858e0'/><rect x='3' y='24' width='26' height='3' rx='1' fill='%235c3d1a'/></svg>">
<style>
  :root{
    --bg:#0e1018;--surface:#1a1c24;--surface2:#252830;
    --border:#2a2d3a;--text:#e8e4d9;--text-dim:#7a7f9a;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  ::-webkit-scrollbar{width:5px;height:5px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:#2e3348;border-radius:4px}
  body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column;height:100vh;overflow:hidden}
  body::after{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at center,transparent 60%,rgba(0,0,0,.55) 100%);pointer-events:none;z-index:9999}

  /* Topbar */
  .topbar{display:flex;align-items:center;gap:12px;padding:10px 18px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0;z-index:100}
  .topbar h1{font-family:'Crimson Pro',serif;font-size:20px;font-weight:400;color:var(--text)}
  .topbar .sub{font-size:11px;color:var(--text-dim)}
  .back-btn{margin-left:auto;padding:5px 14px;font-size:11px;font-weight:600;font-family:'Inter',sans-serif;background:none;border:1px solid var(--border);color:var(--text-dim);border-radius:6px;cursor:pointer;transition:all .15s;text-decoration:none;display:flex;align-items:center;gap:6px}
  .back-btn:hover{background:#2c3040;color:var(--text);border-color:#4a5068}

  /* Main layout */
  .main{flex:1;display:flex;flex-direction:column;padding:24px;gap:16px;overflow:hidden;min-height:0}

  /* Canvas area */
  #timelineCanvas{width:100%;cursor:crosshair;border-radius:8px;background:rgba(255,255,255,.02);border:1px solid var(--border);display:block}
  .axis-hint{font-size:10px;color:var(--text-dim);text-align:center;opacity:.6;letter-spacing:.04em}

  /* Tooltip */
  #tlTooltip{position:fixed;background:#1a1c24;border:1px solid #383d52;color:#e8e4d9;font-size:11px;padding:10px 14px;border-radius:8px;pointer-events:none;z-index:1000;display:none;line-height:1.7;font-family:'Inter',sans-serif;max-width:240px;box-shadow:0 4px 20px rgba(0,0,0,.6)}

  /* Loading */
  #tlLoading{font-size:12px;color:var(--text-dim);font-family:'Inter',sans-serif;padding:8px 0}

  /* Version */
  #version{position:fixed;bottom:8px;left:10px;font-size:10px;color:rgba(255,255,255,.2);font-family:'Inter',sans-serif;pointer-events:none;z-index:10000;letter-spacing:.04em}
</style>
</head>
<body>

<div class="topbar">
  <h1>Reading Timeline</h1>
  <span class="sub">Books read · by year published</span>
  <a class="back-btn" href="bookshelf-wheel.html">🎡 Back to Wheel</a>
</div>

<div class="main">
  <div id="tlLoading">Loading timeline data…</div>
  <canvas id="timelineCanvas"></canvas>
  <div class="axis-hint">X axis — Year Published &nbsp;·&nbsp; Y axis — Page Count &nbsp;·&nbsp; Hover a point for details</div>
</div>

<div id="tlTooltip"></div>
<div id="version">v 0.4</div>

<script>
const CONFIG = {
  sheetsApiKey: 'AIzaSyAJ7g2PGopcKUabGcGFd1fCNLlkY5lzBoI',
  sheetId: '1uVRXjDsrFvvIoWZcB6NYv27WUdEllH4BI91IlYJYHB4',
  // Each series: tab name, title col (0=A), yearCol, pagesCol, readCol, color
  series: [
    { id:'swcanon',   name:'Star Wars Canon',   tab:'Star Wars Canon',   titleCol:0, yearCol:2, pagesCol:4, readCol:6, color:'#4db8ff', startRow:31 },
    { id:'swlegends', name:'Star Wars Legends',      tab:'Star Wars Legends', titleCol:0, yearCol:2, pagesCol:3, readCol:5, color:'#e07820' },
    { id:'asoiaf',    name:'A Song of Ice and Fire', tab:'ASOIAF',            titleCol:0, yearCol:2, pagesCol:3, readCol:5, color:'#8c1a1a' },
    { id:'tolkien',   name:'Tolkien',                tab:'Tolkien',           titleCol:0, yearCol:1, pagesCol:2, readCol:4, color:'#c8a84b' },
    { id:'horus',     name:'Horus Heresy',           tab:'Horus Heresy',      titleCol:0, yearCol:3, pagesCol:4, readCol:6, color:'#c0392b' },
    { id:'fr',        name:'Forgotten Realms',       tab:'Forgotten Realms',  titleCol:0, yearCol:3, pagesCol:4, readCol:6, color:'#2ecc71' },
  ]
};

let allBooks = [];
let hoveredBook = null;

async function loadAll(){
  const loading = document.getElementById('tlLoading');
  const results = await Promise.all(CONFIG.series.map(async s => {
    try {
      const range = encodeURIComponent(s.tab+'!A:G');
      const url = 'https://sheets.googleapis.com/v4/spreadsheets/'+CONFIG.sheetId+'/values/'+range+'?key='+CONFIG.sheetsApiKey;
      const res = await fetch(url);
      if(!res.ok) return [];
      const data = await res.json();
      const rows = (data.values||[]).slice(s.startRow || 1);
      const books = [];
      rows.forEach(row => {
        const title  = (row[s.titleCol]||'').trim();
        const yearRaw= (row[s.yearCol]||'').trim();
        const pages  = parseInt(row[s.pagesCol]||0);
        const read   = (row[s.readCol]||'').trim().toLowerCase();
        if(!title||read!=='yes'||!yearRaw||!pages) return;
        // Parse year from date string (M/D/YYYY or similar)
        const parts = yearRaw.split(/[\\/\-\.]/);
        let year = null;
        for(const p of parts){
          const n = parseInt(p);
          if(n > 1900 && n < 2100){ year=n; break; }
        }
        if(!year) return;
        books.push({ title, year, pages, series:s.name, color:s.color, dateRaw:yearRaw });
      });
      return books;
    } catch(e){ return []; }
  }));

  allBooks = results.flat();
  loading.style.display = 'none';
  const cv2=document.getElementById('timelineCanvas');
  if(cv2){cv2.style.height=(cv2.parentElement.clientHeight-80)+'px';}
  drawTimeline();
}

function resizeCanvas(){
  const cv = document.getElementById('timelineCanvas');
  if(!cv) return;
  cv.width = cv.offsetWidth;
  cv.height = cv.offsetHeight;
}

function drawTimeline(){
  const cv = document.getElementById('timelineCanvas');
  if(!cv||!allBooks.length) return;
  const ctx = cv.getContext('2d');
  // Only resize if dimensions have changed
  if(cv.width !== cv.offsetWidth || cv.height !== cv.offsetHeight){
    cv.width = cv.offsetWidth;
    cv.height = cv.offsetHeight;
  }
  const W=cv.width, H=cv.height;
  const PAD={top:30,right:30,bottom:50,left:65};
  const plotW=W-PAD.left-PAD.right;
  const plotH=H-PAD.top-PAD.bottom;

  ctx.clearRect(0,0,W,H);

  const years = allBooks.map(b=>b.year);
  const pages = allBooks.map(b=>b.pages);
  const minYear=Math.min(...years)-2, maxYear=Math.max(...years)+2;
  const maxPages=Math.max(...pages)*1.12;

  function xPos(y){ return PAD.left+(y-minYear)/(maxYear-minYear)*plotW; }
  function yPos(p){ return PAD.top+plotH-(p/maxPages)*plotH; }

  // Horizontal grid lines
  const pageStep = Math.ceil(maxPages/5/50)*50;
  for(let p=0;p<=maxPages;p+=pageStep){
    const y=yPos(p);
    ctx.strokeStyle='rgba(255,255,255,.05)';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(PAD.left,y);ctx.lineTo(W-PAD.right,y);ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,.3)';ctx.font='10px Inter,sans-serif';
    ctx.textAlign='right';ctx.textBaseline='middle';
    ctx.fillText(p.toLocaleString(),PAD.left-8,y);
  }

  // Vertical grid lines — year ticks
  const yearRange=maxYear-minYear;
  const yearStep=yearRange>40?10:yearRange>20?5:yearRange>10?2:1;
  const startYear=Math.ceil(minYear/yearStep)*yearStep;
  for(let y=startYear;y<=maxYear;y+=yearStep){
    const x=xPos(y);
    ctx.strokeStyle='rgba(255,255,255,.05)';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(x,PAD.top);ctx.lineTo(x,H-PAD.bottom);ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,.3)';ctx.font='10px Inter,sans-serif';
    ctx.textAlign='center';ctx.textBaseline='top';
    ctx.fillText(y,x,H-PAD.bottom+8);
  }

  // Axis labels
  ctx.fillStyle='rgba(255,255,255,.45)';ctx.font='11px Inter,sans-serif';
  ctx.textAlign='center';ctx.textBaseline='bottom';
  ctx.fillText('Year Published',W/2,H-2);
  ctx.save();ctx.translate(14,PAD.top+plotH/2);ctx.rotate(-Math.PI/2);
  ctx.textBaseline='middle';ctx.fillText('Page Count',0,0);ctx.restore();

  // Draw points
  cv._books = allBooks.map(b=>({...b, px:xPos(b.year), py:yPos(b.pages)}));
  cv._books.forEach(b=>{
    const isHov = hoveredBook===b;
    ctx.beginPath();ctx.arc(b.px,b.py,isHov?8:5,0,Math.PI*2);
    ctx.fillStyle=b.color;ctx.fill();
    ctx.strokeStyle=isHov?'rgba(255,255,255,.8)':'rgba(0,0,0,.4)';
    ctx.lineWidth=isHov?2:1;ctx.stroke();
    if(isHov){
      ctx.beginPath();ctx.arc(b.px,b.py,12,0,Math.PI*2);
      ctx.strokeStyle=b.color+'66';ctx.lineWidth=2;ctx.stroke();
    }
  });
}

// Hover
document.addEventListener('mousemove',e=>{
  const cv=document.getElementById('timelineCanvas');
  if(!cv||!cv._books) return;
  const rect=cv.getBoundingClientRect();
  const mx=e.clientX-rect.left, my=e.clientY-rect.top;
  const tip=document.getElementById('tlTooltip');
  let found=null;
  for(const b of cv._books){
    if(Math.sqrt((b.px-mx)**2+(b.py-my)**2)<10){found=b;break;}
  }
  if(found!==hoveredBook){
    hoveredBook=found;
    drawTimeline();
  }
  if(found){
    tip.innerHTML=`<strong style="color:${found.color}">${found.title}</strong><br>`+
      `<span style="opacity:.7">${found.series}</span><br>`+
      `📅 ${found.year}<br>📄 ${found.pages.toLocaleString()} pages`;
    tip.style.display='block';
    tip.style.left=(e.clientX+16)+'px';
    tip.style.top=(e.clientY-10)+'px';
  } else {
    tip.style.display='none';
  }
});

window.addEventListener('resize',()=>{ resizeCanvas(); if(allBooks.length) drawTimeline(); });

loadAll();
</script>
</body>
</html>
