<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Reading Wheel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#1e2028;--surface:#252830;--surface2:#2c3040;--border:#383d52;
  --text:#e8e4d9;--text-dim:#7a7f9a;
  --wood-dark:#3d2810;--wood-mid:#5c3d1a;--wood-light:#7a5228;--shelf-back:#181210;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:16px;padding:10px 20px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0}
.topbar h1{font-family:'Crimson Pro',serif;font-size:22px;font-weight:400}
.topbar .sub{font-size:12px;color:var(--text-dim);margin-left:auto}
.main{display:flex;flex:1;overflow:hidden}
.left{width:300px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:14px;gap:10px;overflow-y:auto}
.phase-lbl{font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text-dim);text-align:center}
.wheel-wrap{position:relative;width:240px;height:240px;align-self:center;flex-shrink:0}
.wheel-wrap canvas{border-radius:50%}
.ptr{position:absolute;top:50%;right:-9px;transform:translateY(-50%);border-top:8px solid transparent;border-bottom:8px solid transparent;border-right:18px solid var(--text)}
.flash{font-size:12px;font-weight:500;text-align:center;padding:8px 12px;border-radius:7px;border:1px solid var(--border);background:var(--surface2);color:var(--text-dim);min-height:38px;line-height:1.4;transition:all .25s}
.flash.boom{background:#3a1515;border-color:#7a2828;color:#ff9090}
.flash.win{background:#153a22;border-color:#287a44;color:#90ffb8}
.speed-row{display:flex;align-items:center;gap:8px}
.speed-row label{font-size:11px;color:var(--text-dim);white-space:nowrap}
.speed-row input{flex:1;accent-color:#5060b0}
.speed-val{font-size:11px;font-weight:600;color:var(--text);min-width:18px;text-align:right}
.btn-row{display:flex;gap:7px}
button{font-family:'Inter',sans-serif;cursor:pointer;border-radius:7px;transition:all .15s;font-size:12px}
.spin-btn{flex:1;padding:8px 14px;border:1px solid var(--border);background:var(--surface2);color:var(--text)}
.spin-btn:hover{background:var(--border)}
.spin-btn:disabled{opacity:.3;cursor:not-allowed}
.reset-btn{padding:8px 10px;border:1px solid var(--border);background:none;color:var(--text-dim)}
.reset-btn:hover{background:var(--surface2)}
.section-title{font-size:10px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--text-dim)}
.legend{display:flex;flex-direction:column;gap:3px}
.li{display:flex;align-items:center;gap:6px;padding:4px 7px;border-radius:6px;border:1px solid var(--border);background:var(--surface2)}
.li.gone{opacity:.3}.li.excl{opacity:.5}
.ldot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.lname{flex:1;font-size:11px;color:var(--text)}
.ltag{font-size:9px;color:var(--text-dim)}
.tog{position:relative;display:inline-block;width:24px;height:14px;flex-shrink:0}
.tog input{opacity:0;width:0;height:0}
.sldr{position:absolute;cursor:pointer;inset:0;background:#444;border-radius:14px;transition:.2s}
.sldr:before{position:absolute;content:'';height:10px;width:10px;left:2px;bottom:2px;background:#fff;border-radius:50%;transition:.2s}
input:checked+.sldr{background:#5060b0}
input:checked+.sldr:before{transform:translateX(10px)}
.elog{display:flex;flex-direction:column;gap:2px;max-height:80px;overflow-y:auto}
.eentry{font-size:10px;color:var(--text-dim);padding:2px 0;border-bottom:1px solid var(--border)}
.right{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.right h2{font-family:'Crimson Pro',serif;font-size:17px;font-weight:400;color:var(--text-dim)}
.bookcase{display:grid;grid-template-columns:1fr 1fr;gap:8px;background:var(--wood-mid);border:5px solid var(--wood-dark);border-radius:3px;padding:8px;box-shadow:inset 0 0 20px rgba(0,0,0,.5),0 4px 20px rgba(0,0,0,.5)}
.shelf{background:var(--shelf-back);border-radius:2px;padding:6px 4px 0;height:90px;display:flex;flex-direction:column;justify-content:flex-end;border-bottom:7px solid var(--wood-light);position:relative;transition:box-shadow .3s;overflow:hidden}
.shelf.shelf-glow{box-shadow:inset 0 0 25px rgba(255,255,200,.12),0 0 12px rgba(255,255,200,.08)}
.snum{position:absolute;top:3px;right:5px;font-size:8px;color:rgba(255,255,255,.15);font-weight:600}
.books-row{display:flex;align-items:flex-end;width:100%;gap:1px}
.book{border-radius:2px 2px 0 0;flex:1;min-width:0;position:relative;transition:opacity .3s,filter .3s,background-color .4s}
.book.s-glow{filter:brightness(1.6) drop-shadow(0 0 5px currentColor)}
.book.s-elim{background:#1e1e1e!important;opacity:.3!important;filter:none!important}
.book.dimmed{opacity:.12}
.book.winner{animation:pulse .7s ease-in-out infinite alternate}
@keyframes pulse{from{filter:brightness(1.3) drop-shadow(0 0 5px currentColor)}to{filter:brightness(2.2) drop-shadow(0 0 14px currentColor)}}
.bnum{position:absolute;bottom:1px;left:50%;transform:translateX(-50%);font-size:5px;color:rgba(255,255,255,.8);font-weight:700;white-space:nowrap;pointer-events:none}
</style>
</head>
<body>
<div class="topbar">
  <h1>The Reading Wheel</h1>
  <span class="sub">Spin · Eliminate · Read</span>
</div>
<div class="main">
  <div class="left">
    <div class="phase-lbl" id="phaseLbl">Series elimination</div>
    <div class="wheel-wrap">
      <canvas id="whl" width="240" height="240"></canvas>
      <div class="ptr"></div>
    </div>
    <div class="speed-row">
      <label for="spd">Speed</label>
      <input type="range" id="spd" min="1" max="10" value="5" oninput="setSpeed(this.value)">
      <span class="speed-val" id="spdV">5</span>
    </div>
    <div class="flash" id="flash">Spin to begin</div>
    <div class="btn-row">
      <button class="spin-btn" id="spinBtn" onclick="spin()">&#9654; Spin</button>
      <button class="reset-btn" onclick="fullReset()">&#8635; Reset</button>
    </div>
    <div class="section-title">Series</div>
    <div class="legend" id="legend"></div>
    <div id="elimWrap" style="display:none">
      <div class="section-title" style="margin-bottom:4px">Eliminated</div>
      <div class="elog" id="elog"></div>
    </div>
  </div>
  <div class="right">
    <h2>Your Bookshelf</h2>
    <div class="bookcase" id="bookcase"></div>
  </div>
</div>

<script>

// ╔══════════════════════════════════════════════════════════════════╗
// ║                     YOUR CONFIG — EDIT HERE                     ║
// ╚══════════════════════════════════════════════════════════════════╝

const CONFIG = {

  // ── SERIES ────────────────────────────────────────────────────────
  // Each entry is one slice on the main wheel.
  // id:    unique key, no spaces (used to link series to shelf books)
  // name:  display name on wheel and legend
  // color: hex colour — must match the colour you painted on the books
  // excl:  true = starts excluded from wheel, false = starts included
  //
  // Special ids — keep these two, they trigger secondary spins:
  //   'shelf'     → triggers shelf picker then book number wheel
  //   'goodreads' → triggers book number wheel (1 to goodreadsCount below)
  series: [
    { id:'swcanon',   name:'Star Wars Canon',  color:'#e03030', excl:false },
    { id:'swlegends', name:'SW Legends',        color:'#e07820', excl:false },
    { id:'asoiaf',    name:'ASOIAF',            color:'#d4c820', excl:false },
    { id:'tolkien',   name:'Tolkien',           color:'#20d840', excl:false },
    { id:'horus',     name:'Horus Heresy',      color:'#00d8d8', excl:false },
    { id:'fr',        name:'Forgotten Realms',  color:'#2858e0', excl:false },
    { id:'darkover',  name:'Darkover',          color:'#9018c0', excl:false },
    { id:'asimov',    name:'Asimov',            color:'#e018b8', excl:false },
    { id:'shelf',     name:'Shelf Pick',        color:'#9a6840', excl:false },
    { id:'goodreads', name:'Goodreads Pick',    color:'#e84040', excl:false },
  ],

  // ── GOODREADS COUNT ───────────────────────────────────────────────
  // How many books are on your Goodreads want-to-read list.
  // Update this whenever your list changes.
  goodreadsCount: 48,

  // ── SHELF PICK SHELVES ────────────────────────────────────────────
  // Which shelves contain books eligible for shelf pick.
  // shelfIdx: 0-based index matching your shelves array below
  //           (shelf 6 in real life = index 5, shelf 7 = index 6, etc.)
  // count:    exact number of shelf-pick books on that shelf
  // label:    name shown on the shelf-picker wheel slice
  //
  // Colors for the shelf-picker wheel slices (one per entry):
  shelfPickColors: ['#5577ff', '#ff5577', '#55ffaa'],
  shelfPicks: [
    { shelfIdx:5, count:10, label:'Shelf 6' },
    { shelfIdx:6, count:28, label:'Shelf 7' },
    { shelfIdx:7, count:29, label:'Shelf 8' },
  ],

  // ── SHELF LAYOUT ──────────────────────────────────────────────────
  // One array entry per physical shelf, top-to-bottom left-to-right
  // (so index 0 = shelf 1, index 1 = shelf 2, index 2 = shelf 3 …)
  //
  // Each shelf is an array of book groups, listed LEFT TO RIGHT.
  // Each group: { id, count }
  //   id:    a series id from above, OR:
  //          'none'  = unselectable books (painted black/grey)
  //          'shelf' = shelf-pick books (painted brown)
  //   count: number of books in this group on that shelf
  //
  // Example — shelf with three series and some unread books:
  //   [ { id:'asoiaf', count:6 }, { id:'tolkien', count:5 }, { id:'none', count:4 } ]
  shelves: [
    // Shelf 1
    [ { id:'swcanon', count:22 } ],
    // Shelf 2
    [ { id:'swcanon', count:20 } ],
    // Shelf 3
    [ { id:'swlegends', count:22 } ],
    // Shelf 4
    [ { id:'swlegends', count:22 } ],
    // Shelf 5 — ASOIAF | Tolkien | Horus Heresy | unread
    [ { id:'asoiaf', count:6 }, { id:'tolkien', count:5 }, { id:'horus', count:5 }, { id:'none', count:4 } ],
    // Shelf 6 — Forgotten Realms | unread | Darkover | Asimov | shelf-pick books
    [ { id:'fr', count:6 }, { id:'none', count:6 }, { id:'darkover', count:3 }, { id:'asimov', count:9 }, { id:'shelf', count:10 } ],
    // Shelf 7 — all shelf-pick books
    [ { id:'shelf', count:28 } ],
    // Shelf 8 — all shelf-pick books
    [ { id:'shelf', count:29 } ],
    // Shelf 9 — unselectable
    [ { id:'none', count:10 } ],
    // Shelf 10 — unselectable
    [ { id:'none', count:6 } ],
    // Shelf 11 — unselectable
    [ { id:'none', count:8 } ],
    // Shelf 12 — unselectable
    [ { id:'none', count:8 } ],
  ],

};

// ╔══════════════════════════════════════════════════════════════════╗
// ║              END OF CONFIG — DO NOT EDIT BELOW                  ║
// ╚══════════════════════════════════════════════════════════════════╝

// Palette for book-number wheel slices
const BOOK_PAL=[
  '#e03030','#e07820','#d4c820','#20d840','#00d8d8','#2858e0','#9018c0','#e018b8',
  '#ff6060','#ffa040','#ffe040','#50f080','#40f0f0','#5070f0','#b040e0','#f040d0',
  '#ff4040','#ff9030','#f0e030','#30e860','#20e8e8','#4068f8','#a028d8','#f828c8',
  '#e85050','#e89040','#e8e040','#40f070','#30f0f0','#5878f0','#b848e8','#f048d8',
];

// ── STATE ──
let SERIES = CONFIG.series.map(s=>({...s})); // live copy with excl state
let eliminated=[];
let phase='main';
let spinning=false;
let raf=null;
let angle=0;
let vel=0;
let speed=5;
let activeSegs=[];
let shelfPick=null;
let liveHL=null;
let bookColors=[];

// ── SPEED ──
function setSpeed(v){speed=+v;document.getElementById('spdV').textContent=v;}
function initVel(){return 0.08+(speed-1)*(0.47/9);}
function decelRate(){return 0.988+(speed-1)*(0.008/9);}

// ── HELPERS ──
function getSeries(id){return SERIES.find(s=>s.id===id);}
function active(){return SERIES.filter(s=>!eliminated.includes(s.id)&&!s.excl);}

// ── SEGMENTS ──
function mainSegs(){
  const a=active();if(!a.length)return[];
  const sw=(Math.PI*2)/a.length;
  return a.map((s,i)=>({...s,sa:i*sw,sw,frac:1/a.length}));
}
function shelfSegs(){
  const picks=CONFIG.shelfPicks;
  const sw=(Math.PI*2)/picks.length;
  return picks.map((p,i)=>({
    id:'sp'+i, name:p.label,
    color:CONFIG.shelfPickColors[i]||'#8888ff',
    pickData:p, sa:i*sw, sw, frac:1/picks.length
  }));
}
function bookSegs(count){
  const sw=(Math.PI*2)/count;
  return Array.from({length:count},(_,i)=>({
    id:'b'+i, name:String(i+1),
    color:bookColors[i]||BOOK_PAL[i%BOOK_PAL.length],
    bookIdx:i, sa:i*sw, sw, frac:1/count
  }));
}

// ── DRAW ──
function draw(){
  const cv=document.getElementById('whl');
  const ctx=cv.getContext('2d');
  const cx=120,cy=120,r=118;
  ctx.clearRect(0,0,240,240);
  let segs;
  if(phase==='main')       segs=mainSegs();
  else if(phase==='shelf') segs=shelfSegs();
  else if(phase==='book')  segs=bookSegs(shelfPick.count);
  else segs=[];
  activeSegs=segs;
  if(!segs.length){ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fillStyle='#1a1a1a';ctx.fill();return;}
  segs.forEach(seg=>{
    const s=seg.sa-angle,e=s+seg.sw;
    ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,r,s,e);ctx.closePath();
    ctx.fillStyle=seg.color;ctx.fill();
    ctx.strokeStyle='rgba(0,0,0,.5)';ctx.lineWidth=1.5;ctx.stroke();
    if(seg.frac>.022){
      const mid=s+seg.sw/2,tr=r*.63;
      ctx.save();
      ctx.translate(cx+Math.cos(mid)*tr,cy+Math.sin(mid)*tr);
      ctx.rotate(mid+Math.PI/2);
      ctx.fillStyle='rgba(255,255,255,.95)';
      const fs=seg.frac>.18?11:seg.frac>.1?9:7;
      ctx.font='600 '+fs+'px Inter,sans-serif';
      ctx.textAlign='center';ctx.textBaseline='middle';
      let lbl=seg.name;
      if(ctx.measureText(lbl).width>seg.frac*r*1.0){const p=lbl.split(' ');lbl=p.length>1?p[0]:lbl.slice(0,5)+'…';}
      ctx.fillText(lbl,0,0);ctx.restore();
    }
  });
  ctx.beginPath();ctx.arc(cx,cy,13,0,Math.PI*2);
  ctx.fillStyle='#1e2028';ctx.fill();
  ctx.strokeStyle='#383d52';ctx.lineWidth=1;ctx.stroke();
}

// ── HIT ──
function hitSeg(){
  const PI2=Math.PI*2;
  let a=((angle%PI2)+PI2)%PI2;
  for(const seg of activeSegs){
    const s=((seg.sa%PI2)+PI2)%PI2,e=s+seg.sw;
    if(e<=PI2){if(a>=s&&a<e)return seg;}
    else{if(a>=s||a<e-PI2)return seg;}
  }
  return activeSegs[0];
}

// ── SPIN ──
function spin(){
  const a=active();
  if(!a.length||spinning)return;
  if(phase==='main'&&a.length<=1)return;
  spinning=true;
  document.getElementById('spinBtn').disabled=true;
  flash('Spinning…','');
  clearBookGlow();
  vel=initVel()*.85+Math.random()*initVel()*.3;
  const dc=decelRate();
  function frame(){
    angle+=vel;vel*=dc;draw();
    if(phase==='main'){
      const h=hitSeg();
      if(h&&h.id!==liveHL){liveHL=h.id;shelfHighlightSeries(h.id,false);}
    } else if(phase==='shelf'){
      const h=hitSeg();
      if(h&&h.id!==liveHL){liveHL=h.id;highlightShelfPick(h);}
    } else if(phase==='book'){
      const h=hitSeg();
      if(h&&h.bookIdx!==undefined&&h.bookIdx!==liveHL){
        liveHL=h.bookIdx;shelfHighlightBook(shelfPick.shelfIdx,h.bookIdx,false);
      }
    }
    if(vel>.0018){raf=requestAnimationFrame(frame);}
    else{spinning=false;liveHL=null;clearBookGlow();land(hitSeg());}
  }
  raf=requestAnimationFrame(frame);
}

// ── LAND ──
function land(seg){
  if(phase==='main'){
    eliminated.push(seg.id);
    logElim(seg.name);
    greyBooks(seg.id);
    draw();renderLegend();
    const a=active();
    if(a.length===1){
      const w=a[0];
      if(w.id==='shelf'){
        flash('Shelf Pick wins! Spin for your shelf.','win');
        setPhase('Pick a shelf');
        setTimeout(()=>{phase='shelf';angle=0;draw();enableSpin();},1300);
      } else if(w.id==='goodreads'){
        flash('Goodreads Pick wins! Spin for a number.','win');
        shelfPick={count:CONFIG.goodreadsCount,shelfIdx:null,label:'Goodreads list'};
        bookColors=Array.from({length:CONFIG.goodreadsCount},(_,i)=>BOOK_PAL[i%BOOK_PAL.length]);
        setPhase('Goodreads — pick a number');
        setTimeout(()=>{phase='book';angle=0;draw();enableSpin();},1300);
      } else {
        flash('★ Read next: '+w.name,'win');
        shelfHighlightSeries(w.id,true);
      }
    } else if(!a.length){
      flash('All series eliminated!','win');
    } else {
      flash('Eliminated: '+seg.name,'boom');
      setTimeout(enableSpin,600);
    }
  } else if(phase==='shelf'){
    shelfPick=seg.pickData;
    flash(seg.name+' — spin for your book!','');
    setPhase('Pick a book number');
    bookColors=Array.from({length:shelfPick.count},(_,i)=>BOOK_PAL[i%BOOK_PAL.length]);
    colourShelfBooks(shelfPick.shelfIdx,bookColors);
    glowShelf(shelfPick.shelfIdx);
    phase='book';angle=0;draw();enableSpin();
  } else if(phase==='book'){
    flash('Book #'+seg.name+' — go find it!','win');
    setPhase('Your book!');
    if(shelfPick.shelfIdx!==null) shelfHighlightBook(shelfPick.shelfIdx,seg.bookIdx,true);
    const btn=document.getElementById('spinBtn');
    btn.textContent='Re-spin';btn.disabled=false;btn.onclick=reSpinBook;
  }
}

function reSpinBook(){
  const btn=document.getElementById('spinBtn');
  btn.onclick=spin;btn.textContent='▶ Spin';
  clearBookGlow();flash('Re-spinning…','');spin();
}
function enableSpin(){document.getElementById('spinBtn').disabled=false;}

// ── SHELF VISUALS ──
function shelfHighlightSeries(sid,final){
  document.querySelectorAll('.book').forEach(b=>{
    if(b.classList.contains('s-elim'))return;
    const bid=b.dataset.sid;
    if(bid===sid){
      b.classList.add(final?'winner':'s-glow');
      b.classList.remove('dimmed');b.style.opacity='';
    } else {
      b.classList.remove('s-glow','winner');
      if(bid!=='none'&&bid!=='shelf') b.classList.add('dimmed');
      else b.style.opacity='';
    }
  });
}

function highlightShelfPick(seg){
  const shelves=document.querySelectorAll('.shelf');
  CONFIG.shelfPicks.forEach(p=>{
    const shelf=shelves[p.shelfIdx];
    if(!shelf)return;
    const isActive=seg.pickData&&seg.pickData.shelfIdx===p.shelfIdx;
    if(isActive){
      shelf.classList.add('shelf-glow');
      shelf.querySelectorAll('.book[data-sid="shelf"]').forEach(b=>{b.classList.add('s-glow');b.classList.remove('dimmed');});
    } else {
      shelf.classList.remove('shelf-glow');
      shelf.querySelectorAll('.book[data-sid="shelf"]').forEach(b=>{b.classList.remove('s-glow');b.classList.add('dimmed');});
    }
  });
}

function shelfHighlightBook(shelfIdx,bookIdx,final){
  if(shelfIdx===null)return;
  const shelf=document.querySelectorAll('.shelf')[shelfIdx];
  if(!shelf)return;
  const books=[...shelf.querySelectorAll('.book[data-sid="shelf"]')];
  books.forEach((b,i)=>{
    if(i===bookIdx){b.classList.add(final?'winner':'s-glow');b.classList.remove('dimmed');}
    else{b.classList.remove('s-glow','winner');b.classList.add('dimmed');}
  });
}

function clearBookGlow(){
  document.querySelectorAll('.book').forEach(b=>{b.classList.remove('s-glow','dimmed','winner');b.style.opacity='';});
  document.querySelectorAll('.shelf').forEach(s=>s.classList.remove('shelf-glow'));
}

function greyBooks(sid){
  document.querySelectorAll('.book[data-sid="'+sid+'"]').forEach(b=>{
    b.classList.add('s-elim');b.classList.remove('s-glow','dimmed','winner');
  });
}

function glowShelf(idx){
  const shelves=document.querySelectorAll('.shelf');
  if(shelves[idx])shelves[idx].classList.add('shelf-glow');
}

function colourShelfBooks(shelfIdx,colors){
  if(shelfIdx===null)return;
  const shelf=document.querySelectorAll('.shelf')[shelfIdx];
  if(!shelf)return;
  const books=[...shelf.querySelectorAll('.book[data-sid="shelf"]')];
  books.forEach((b,i)=>{b.style.backgroundColor=colors[i]||'#7a5030';});
}

// ── BUILD BOOKCASE ──
function buildBookcase(){
  const bc=document.getElementById('bookcase');
  bc.innerHTML='';
  let seed=42;
  function rand(min,max){seed=(seed*1664525+1013904223)&0xffffffff;return min+((seed>>>0)%(max-min+1));}

  CONFIG.shelves.forEach((groups,idx)=>{
    const shelf=document.createElement('div');
    shelf.className='shelf';
    const snum=document.createElement('span');
    snum.className='snum';snum.textContent=idx+1;
    shelf.appendChild(snum);
    const row=document.createElement('div');
    row.className='books-row';
    groups.forEach(g=>{
      for(let i=0;i<g.count;i++){
        const b=document.createElement('div');
        b.className='book';
        b.dataset.sid=g.id;
        let h,col;
        if(g.id==='none'){h=rand(38,58);col='#2a2a2a';}
        else if(g.id==='shelf'){h=rand(52,72);col='#7a5030';}
        else{h=rand(55,78);col=getSeries(g.id)?.color||'#555';}
        b.style.cssText='height:'+h+'px;flex:1;min-width:0;background:'+col;
        if(g.id==='shelf'){
          const numEl=document.createElement('span');
          numEl.className='bnum';numEl.textContent=String(i+1);
          b.appendChild(numEl);
        }
        row.appendChild(b);
      }
    });
    shelf.appendChild(row);
    bc.appendChild(shelf);
  });

  requestAnimationFrame(()=>{
    document.querySelectorAll('.bnum').forEach(n=>{
      n.style.display=n.parentElement.getBoundingClientRect().width<10?'none':'';
    });
  });
}

// ── LEGEND ──
function renderLegend(){
  const list=document.getElementById('legend');
  list.innerHTML='';
  SERIES.forEach(s=>{
    const gone=eliminated.includes(s.id);
    const item=document.createElement('div');
    item.className='li'+(gone?' gone':s.excl?' excl':'');
    const tag=s.id==='shelf'?'shelves 6–8':s.id==='goodreads'?'#1–'+CONFIG.goodreadsCount:'';
    const tog=gone?'':`<label class="tog"><input type="checkbox" ${s.excl?'':'checked'} onchange="toggleExcl('${s.id}')"><span class="sldr"></span></label>`;
    item.innerHTML=`<span class="ldot" style="background:${s.color}"></span><span class="lname">${s.name}</span>${tag?`<span class="ltag">${tag}</span>`:''} ${tog}`;
    list.appendChild(item);
  });
}
function toggleExcl(id){const s=SERIES.find(x=>x.id===id);if(s)s.excl=!s.excl;draw();renderLegend();}

// ── UTILS ──
function flash(msg,cls){const f=document.getElementById('flash');f.textContent=msg;f.className='flash'+(cls?' '+cls:'');}
function setPhase(t){document.getElementById('phaseLbl').textContent=t;}
function logElim(name){
  document.getElementById('elimWrap').style.display='block';
  const e=document.createElement('div');e.className='eentry';
  e.textContent='#'+eliminated.length+' — '+name;
  document.getElementById('elog').prepend(e);
}

// ── RESET ──
function fullReset(){
  SERIES=CONFIG.series.map(s=>({...s}));
  eliminated=[];phase='main';angle=0;spinning=false;
  shelfPick=null;liveHL=null;bookColors=[];
  if(raf)cancelAnimationFrame(raf);
  const btn=document.getElementById('spinBtn');
  btn.disabled=false;btn.onclick=spin;btn.textContent='▶ Spin';
  setPhase('Series elimination');
  document.getElementById('elog').innerHTML='';
  document.getElementById('elimWrap').style.display='none';
  flash('Spin to begin','');
  clearBookGlow();
  buildBookcase();
  renderLegend();
  draw();
}

// ── INIT ──
buildBookcase();
renderLegend();
draw();
</script>
</body>
