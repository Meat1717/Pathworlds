<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Reading Wheel</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%231e2028'/><rect x='4' y='8' width='6' height='16' rx='1' fill='%23e03030'/><rect x='11' y='10' width='5' height='14' rx='1' fill='%23e07820'/><rect x='17' y='7' width='7' height='17' rx='1' fill='%232858e0'/><rect x='3' y='24' width='26' height='3' rx='1' fill='%235c3d1a'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#1e2028;--surface:#252830;--surface2:#2c3040;--border:#383d52;
  --text:#e8e4d9;--text-dim:#7a7f9a;
  --wood-dark:#3d2810;--wood-mid:#5c3d1a;--wood-light:#7a5228;--shelf-back:#181210;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column}
/* Dark scrollbars */
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#2e3348;border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:#3a405a}
*{scrollbar-width:thin;scrollbar-color:#2e3348 transparent}
body::after{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at center,transparent 60%,rgba(0,0,0,.55) 100%);pointer-events:none;z-index:9999}
#version{position:fixed;bottom:8px;left:10px;font-size:10px;color:rgba(255,255,255,.25);font-family:'Inter',sans-serif;pointer-events:none;z-index:10000;letter-spacing:.04em}
.topbar{display:flex;align-items:center;gap:16px;padding:10px 20px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0}
.topbar h1{font-family:'Crimson Pro',serif;font-size:22px;font-weight:400}
.topbar .sub{font-size:12px;color:var(--text-dim);margin-left:auto}
.main{display:flex;flex:1;overflow:hidden}
.left{width:300px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:14px;gap:10px;overflow-y:hidden;transition:background 1.2s ease}
.phase-lbl{font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text-dim);text-align:center}
.wheel-wrap{position:relative;width:240px;height:240px;align-self:center;flex-shrink:0}
.wheel-wrap canvas{border-radius:50%;box-shadow:0 6px 24px rgba(0,0,0,.7),0 2px 8px rgba(0,0,0,.5)}
.ptr{position:absolute;top:50%;right:-9px;transform:translateY(-50%);border-top:8px solid transparent;border-bottom:8px solid transparent;border-right:18px solid var(--text);transform-origin:center right}
@keyframes ptrBounce{
  0%  {transform:translateY(-50%) scaleX(1)   ;filter:none}
  15% {transform:translateY(-50%) scaleX(1.7) ;filter:drop-shadow(0 0 6px rgba(255,255,255,.95))}
  35% {transform:translateY(-50%) scaleX(0.7) ;filter:none}
  55% {transform:translateY(-50%) scaleX(1.3) ;filter:drop-shadow(0 0 3px rgba(255,255,255,.5))}
  75% {transform:translateY(-50%) scaleX(0.9) ;filter:none}
  100%{transform:translateY(-50%) scaleX(1)   ;filter:none}
}
.ptr.bounce{animation:ptrBounce .55s ease-out forwards}
.flash{font-size:12px;font-weight:500;text-align:center;padding:8px 12px;border-radius:7px;border:1px solid var(--border);background:var(--surface2);color:var(--text-dim);min-height:38px;line-height:1.4;transition:all .25s}
.flash.boom{background:#3a1515;border-color:#7a2828;color:#ff9090}
.flash.win{background:#153a22;border-color:#287a44;color:#90ffb8}
/* Winner banner */
#winnerBanner{display:none;flex-direction:column;align-items:center;gap:6px;padding:14px 16px;border-radius:10px;border:2px solid;text-align:center;width:100%}
#winnerBanner .wb-crown{font-size:22px;line-height:1}
#winnerBanner .wb-label{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;opacity:.7}
#winnerBanner .wb-name{font-family:'Crimson Pro',serif;font-size:20px;font-weight:600;line-height:1.2}

/* Winner popup overlay */
#winnerPopup{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:2000;pointer-events:none}
#winnerPopup.active{display:flex}
#winnerPopupInner{display:flex;flex-direction:column;align-items:center;gap:16px;padding:40px 60px;border-radius:20px;border:3px solid;text-align:center;pointer-events:none;animation:popupIn .6s cubic-bezier(.175,.885,.32,1.275) forwards}
@keyframes popupIn{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
@keyframes popupOut{from{opacity:1;transform:scale(1)}to{opacity:0;transform:scale(.4) translateY(40px)}}
#winnerPopupInner.shrinking{animation:popupOut .5s cubic-bezier(.55,.055,.675,.19) forwards}
#winnerPopup .pop-crown{font-size:52px;line-height:1;animation:crownBounce .8s ease-out .4s both}
@keyframes crownBounce{0%{transform:translateY(-20px) scale(.5);opacity:0}60%{transform:translateY(6px) scale(1.1)}100%{transform:translateY(0) scale(1);opacity:1}}
#winnerPopup .pop-label{font-size:13px;font-weight:600;letter-spacing:.15em;text-transform:uppercase;opacity:.75;font-family:'Inter',sans-serif}
#winnerPopup .pop-name{font-family:'Crimson Pro',serif;font-size:42px;font-weight:600;line-height:1.2;max-width:600px}
.speed-row{display:flex;align-items:center;gap:8px}
.speed-row label{font-size:11px;color:var(--text-dim);white-space:nowrap}
.speed-row input{flex:1;accent-color:#5060b0}
.speed-val{font-size:11px;font-weight:600;color:var(--text);min-width:18px;text-align:right}
.btn-row{display:flex;gap:7px}
button{font-family:'Inter',sans-serif;cursor:pointer;border-radius:7px;transition:all .15s;font-size:12px}
.spin-btn{flex:1;padding:8px 14px;border:1px solid var(--border);background:var(--surface2);color:var(--text)}
.spin-btn:hover{background:var(--border)}
.spin-btn:disabled{opacity:.3;cursor:not-allowed}
.reset-btn{padding:8px 10px;border:1px solid var(--border);background:none;color:var(--text-dim)}
.reset-btn:hover{background:var(--surface2)}
.section-title{font-size:10px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--text-dim)}
.legend{display:flex;flex-direction:column;gap:3px}
.li{display:flex;align-items:center;gap:6px;padding:4px 7px;border-radius:6px;border:1px solid var(--border);background:var(--surface2)}
.li.gone{opacity:.3}.li.excl{opacity:.5}
.ldot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.lname{flex:1;font-size:11px;color:var(--text)}
.ltag{font-size:9px;color:var(--text-dim)}
.tog{position:relative;display:inline-block;width:24px;height:14px;flex-shrink:0}
.tog input{opacity:0;width:0;height:0}
.sldr{position:absolute;cursor:pointer;inset:0;background:#444;border-radius:14px;transition:.2s}
.sldr:before{position:absolute;content:'';height:10px;width:10px;left:2px;bottom:2px;background:#fff;border-radius:50%;transition:.2s}
input:checked+.sldr{background:#5060b0}
input:checked+.sldr:before{transform:translateX(10px)}
.elog{display:flex;flex-direction:column;gap:2px;max-height:80px;overflow-y:auto}
.eentry{font-size:10px;color:var(--text-dim);padding:2px 0;border-bottom:1px solid var(--border)}
.right{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px;position:relative}
/* Right stats panel */
.sp-series-row-wrap{display:flex;flex-direction:row;gap:10px;flex:1;min-height:0;overflow:hidden}
.sp-vert-bar{width:22px;flex-shrink:0;border-radius:6px;overflow:hidden;display:flex;flex-direction:column;align-self:stretch;cursor:default;position:relative}
/* Unified rest overlay - covers whole bar with single colour */
.sp-vert-bar-rest{position:absolute;left:0;right:0;bottom:0;background:#7F77DD;transition:opacity .3s,height 1s ease;border-radius:0 0 6px 6px;pointer-events:none;z-index:2}
.sp-vert-bar-rest-label{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) rotate(180deg);writing-mode:vertical-rl;font-size:9px;font-weight:600;color:rgba(255,255,255,.9);font-family:'Inter',sans-serif;white-space:nowrap;letter-spacing:.04em;text-align:center;z-index:3;pointer-events:none}
.sp-vert-bar.has-hover .sp-vert-bar-rest-label{opacity:0;transition:opacity .2s}
.sp-vert-bar-unread{position:absolute;left:0;right:0;top:0;bottom:0;background:#2a2a3a;border-radius:6px;pointer-events:none;z-index:1}
.sp-vert-segment{flex-shrink:0;position:relative;transition:filter .25s,opacity .25s;z-index:3}
.sp-vert-segment .read-portion{position:absolute;bottom:0;left:0;right:0;transition:height .8s ease}
.sp-vert-segment .unread-portion{position:absolute;top:0;left:0;right:0;bottom:0}
.sp-vert-segment{opacity:0;transition:opacity .25s,filter .25s}
.sp-vert-bar.has-hover .sp-vert-bar-rest{opacity:0}
.sp-vert-bar.has-hover .sp-vert-segment{opacity:.15;filter:saturate(.2)}
.sp-vert-bar.has-hover .sp-vert-segment.hovered{opacity:1;filter:brightness(1.5) saturate(1.5) drop-shadow(0 0 4px currentColor)}

.stats-panel{width:260px;flex-shrink:0;background:var(--surface);border-left:1px solid var(--border);display:flex;flex-direction:column;padding:14px;gap:14px;overflow-y:auto}
.stats-panel h2{font-family:'Crimson Pro',serif;font-size:18px;font-weight:400;color:var(--text)}
.sp-section{display:flex;flex-direction:column;gap:6px}
.sp-title{font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text-dim);font-family:'Inter',sans-serif}
.sp-overall-card{display:flex;flex-direction:column;gap:6px;padding:10px 12px;background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:10px}
.sp-oc-label{font-size:10px;color:var(--text-dim);font-family:'Inter',sans-serif;font-weight:500}
.sp-oc-nums{display:flex;align-items:baseline;gap:6px}
.sp-oc-main{font-family:'Crimson Pro',serif;font-size:20px;font-weight:600}
.sp-oc-total{font-size:11px;color:var(--text-dim);font-family:'Inter',sans-serif}
.sp-oc-pct{font-size:11px;font-weight:500;font-family:'Inter',sans-serif}
.sp-bar-wrap{height:4px;background:rgba(255,255,255,.08);border-radius:2px;overflow:hidden}
.sp-bar{height:100%;border-radius:2px;transition:width 1s ease}
.sp-series-card{display:flex;flex-direction:column;gap:5px;padding:8px 10px;background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:8px}
.sp-series-card:hover{border-color:var(--border-strong)}
.sp-series-name{font-size:11px;font-weight:600;font-family:'Inter',sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sp-series-row{display:flex;align-items:center;justify-content:space-between;gap:6px}
.sp-series-count{font-family:'Crimson Pro',serif;font-size:15px;font-weight:600}
.sp-series-pct{font-size:10px;font-weight:500;font-family:'Inter',sans-serif;opacity:.8}
.sp-loading{font-size:11px;color:var(--text-dim);font-family:'Inter',sans-serif;text-align:center;padding:8px 0}


#seriesBg{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transition:opacity 1s ease;pointer-events:none;z-index:0}
#seriesVignette{position:absolute;inset:0;pointer-events:none;z-index:0;opacity:0;transition:opacity 1s ease}
.right h2,.right .bookcase-wrap{position:relative;z-index:1}
.right h2{font-family:'Crimson Pro',serif;font-size:17px;font-weight:400;color:var(--text-dim)}
.bookcase{display:grid;grid-template-columns:1fr 1fr;gap:8px;background:var(--wood-mid);border:5px solid var(--wood-dark);border-radius:3px;padding:8px;box-shadow:inset 0 0 20px rgba(0,0,0,.5),0 4px 20px rgba(0,0,0,.5);background-image:repeating-linear-gradient(180deg,transparent,transparent 95px,rgba(0,0,0,.45) 95px,rgba(0,0,0,.45) 97px,rgba(255,255,255,.12) 97px,rgba(255,255,255,.12) 99px,transparent 99px)}
.shelf{background:var(--shelf-back);border-radius:2px;padding:6px 4px 0;height:90px;display:flex;flex-direction:column;justify-content:flex-end;border-bottom:7px solid var(--wood-light);position:relative;transition:box-shadow .3s;overflow:hidden}
.shelf::before{content:'';position:absolute;top:0;left:0;right:0;height:28px;background:linear-gradient(to bottom,rgba(255,220,120,.10),transparent);pointer-events:none;z-index:3}
.shelf.shelf-glow{box-shadow:inset 0 0 25px rgba(255,255,200,.12),0 0 12px rgba(255,255,200,.08)}
.snum{position:absolute;top:3px;right:5px;font-size:8px;color:rgba(255,255,255,.15);font-weight:600}
.books-row{display:flex;align-items:flex-end;width:100%;gap:1px}
.book{border-radius:2px 2px 0 0;flex:1;min-width:0;position:relative;transition:opacity .08s,filter .08s,background-color .4s;box-shadow:2px 0 4px rgba(0,0,0,.5),-1px 0 2px rgba(0,0,0,.3)}
.book::before{content:'';position:absolute;top:0;left:0;width:3px;height:100%;background:linear-gradient(to right,rgba(255,255,255,.18),rgba(255,255,255,.04));border-radius:2px 0 0 0;pointer-events:none}
.book.s-glow{filter:brightness(1.6) drop-shadow(0 0 5px currentColor)}
.book.s-elim{background:#1e1e1e!important;opacity:.3!important;filter:none!important}
.book.dimmed{opacity:.22}
.book.winner{animation:pulse .7s ease-in-out infinite alternate}
@keyframes pulse{from{filter:brightness(1.3) drop-shadow(0 0 5px currentColor)}to{filter:brightness(2.2) drop-shadow(0 0 14px currentColor)}}
.bnum{position:absolute;bottom:1px;left:50%;transform:translateX(-50%);font-size:5px;color:rgba(255,255,255,.8);font-weight:700;white-space:nowrap;pointer-events:none}

/* Book texture overlay */
.book::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(0,0,0,.08) 0px,rgba(0,0,0,0) 1px,rgba(0,0,0,0) 3px,rgba(255,255,255,.04) 4px,rgba(255,255,255,0) 5px);pointer-events:none;border-radius:2px 2px 0 0}

/* Tooltip */
.book-tip{position:fixed;background:#1a1c24;border:1px solid #383d52;color:#e8e4d9;font-size:10px;font-weight:500;padding:4px 8px;border-radius:5px;pointer-events:none;z-index:999;white-space:nowrap;opacity:0;transition:opacity .15s;font-family:'Inter',sans-serif}

/* Confetti canvas */
#confetti{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:1000;display:none}
/* Dust canvas */
#dust{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:1}

</style>
</head>
<body>
<canvas id="confetti"></canvas>
<div class="topbar">
  <h1>The Reading Wheel</h1>
  <span class="sub">Spin · Eliminate · Read &nbsp;·&nbsp; <span style="opacity:.5">Space = spin &nbsp; R = reset &nbsp; F = fullscreen</span></span>
  <div style="display:flex;align-items:center;gap:10px;margin-left:auto">
    <span id="clock" style="font-size:12px;color:var(--text-dim);font-variant-numeric:tabular-nums;letter-spacing:.05em"></span>
    <button id="fsBtn" onclick="toggleFullscreen()" title="Fullscreen (F)" style="background:none;border:1px solid var(--border);color:var(--text-dim);padding:5px 10px;font-size:13px;cursor:pointer;border-radius:6px;font-family:inherit">&#x26F6;</button>
  </div>
</div>
<div class="book-tip" id="bookTip"></div>
<div id="version">v 0.34</div>
<div id="winnerPopup"><div id="winnerPopupInner"><div class="pop-crown">👑</div><div class="pop-label">Read next</div><div class="pop-name" id="popName">...</div></div></div>

<div class="main">
  <div class="left">
    <div class="phase-lbl" id="phaseLbl">Series elimination</div>
    <div class="wheel-wrap">
      <canvas id="whl" width="240" height="240"></canvas>
      <div class="ptr"></div>
    </div>
    <div class="speed-row">
      <label for="spd">Speed</label>
      <input type="range" id="spd" min="1" max="10" value="5" oninput="setSpeed(this.value)">
      <span class="speed-val" id="spdV">5</span>
    </div>
    <div class="flash" id="flash">Spin to begin</div>
    <div id="winnerBanner">
      <div class="wb-crown">👑</div>
      <div class="wb-label">Read next</div>
      <div class="wb-name" id="wbName"></div>
    </div>
    <div class="btn-row">
      <button class="spin-btn" id="spinBtn" onclick="spin()">&#9654; Spin</button>
      <button class="reset-btn" onclick="fullReset()">&#8635; Reset</button>
    </div>
    <div style="flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;min-height:0">
      <div class="section-title">Series</div>
      <div class="legend" id="legend"></div>
      <div id="elimWrap" style="display:none">
        <div class="section-title" style="margin-bottom:4px">Eliminated</div>
        <div class="elog" id="elog"></div>
      </div>
    </div>
  </div>
  <div class="right">
    <div id="seriesBg"></div>
    <div id="seriesVignette"></div>
    <canvas id="dust"></canvas>
    <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap">
        <div style="display:flex;align-items:center;gap:8px;margin-left:auto">
        <label for="shelfScale" style="font-size:11px;color:var(--text-dim);white-space:nowrap">Size</label>
        <input type="range" id="shelfScale" min="0.6" max="2.2" step="0.05" value="1.3"
          style="width:90px;accent-color:#5060b0"
          oninput="scaleBookcase(this.value)">
        <span id="scaleVal" style="font-size:11px;color:var(--text-dim);min-width:32px">130%</span>
      </div>
    </div>
    <div class="bookcase-wrap" style="position:relative;width:100%;max-width:600px;margin:0 auto">
      <canvas id="woodShimmer" style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:10;opacity:.5;border-radius:3px"></canvas>
      <div class="bookcase" id="bookcase" style="max-width:100%"></div>
    </div>

  </div>
  <div class="stats-panel">
    <h2>Reading stats</h2>
    <div class="sp-section">
      <div class="sp-title">Overall</div>
      <div id="spOverall"><div class="sp-loading">Loading…</div></div>
    </div>
    <div class="sp-section">
      <div class="sp-title">Pages read</div>
      <div id="spPages"><div class="sp-loading">Loading…</div></div>
    </div>
    <div class="sp-series-row-wrap">
      <div id="spVertBar" class="sp-vert-bar"><div class="sp-loading" style="writing-mode:vertical-rl">Loading…</div></div>
      <div class="sp-section" style="flex:1;min-width:0">
        <div class="sp-title">By series</div>
        <div id="spSeries" style="display:flex;flex-direction:column;gap:5px"><div class="sp-loading">Loading…</div></div>
      </div>
    </div>
  </div>
</div>

<script>

// ╔══════════════════════════════════════════════════════════════════╗
// ║                     YOUR CONFIG — EDIT HERE                     ║
// ╚══════════════════════════════════════════════════════════════════╝

const CONFIG = {

  // ── SERIES ────────────────────────────────────────────────────────
  // Each entry is one slice on the main wheel.
  // id:    unique key, no spaces (used to link series to shelf books)
  // name:  display name on wheel and legend
  // color: hex colour — must match the colour you painted on the books
  // excl:  true = starts excluded from wheel, false = starts included
  //
  // Special ids — keep these two, they trigger secondary spins:
  //   'shelf'     → triggers shelf picker then book number wheel
  //   'goodreads' → triggers book number wheel (1 to goodreadsCount below)
  series: [
    { id:'swcanon',   name:'Star Wars Canon',  color:'#4db8ff', excl:false, bgImage:'assets/bookshelf/swcanon.jpg' },
    { id:'swlegends', name:'Star Wars Legends',        color:'#e07820', excl:false, bgImage:'assets/bookshelf/swlegends.jpg' },
    { id:'asoiaf',    name:'A Song of Ice and Fire',            color:'#8c1a1a', excl:false, bgImage:'assets/bookshelf/asoiaf.jpg' },
    { id:'tolkien',   name:'Tolkien',           color:'#c8a84b', excl:false, bgImage:'assets/bookshelf/lotr.jpg' },
    { id:'horus',     name:'Horus Heresy',      color:'#c0392b', excl:false, bgImage:'assets/bookshelf/horus.jpg' },
    { id:'fr',        name:'Forgotten Realms',  color:'#2ecc71', excl:false, bgImage:'assets/bookshelf/forgottenrealms.jpg' },
    { id:'darkover',  name:'Darkover',          color:'#b8860b', excl:false, bgImage:'assets/bookshelf/darkover.jpg' },
    { id:'asimov',    name:'Asimov',            color:'#00bcd4', excl:false, bgImage:'assets/bookshelf/asimov.jpg' },
    { id:'shelf',     name:'Shelf Pick',        color:'#9a6840', excl:false, bgImage:'assets/bookshelf/shelf.jpg' },
    { id:'goodreads', name:'Goodreads Pick',    color:'#e84040', excl:false, bgImage:'assets/bookshelf/goodreads.jpg' },
  { id:'misc',      name:'Misc Books',          color:'#8a8fa8', excl:true },
  ],

  // ── GOODREADS COUNT ───────────────────────────────────────────────
  // How many books are on your Goodreads want-to-read list.
  // Update this whenever your list changes.
  goodreadsCount: 45,

  // ── SHELF PICK SHELVES ────────────────────────────────────────────
  // Which shelves contain books eligible for shelf pick.
  // shelfIdx: 0-based index matching your shelves array below
  //           (shelf 6 in real life = index 5, shelf 7 = index 6, etc.)
  // count:    exact number of shelf-pick books on that shelf
  // label:    name shown on the shelf-picker wheel slice
  //
  // Colors for the shelf-picker wheel slices (one per entry):

// Palette for book-number wheel slices
const BOOK_PAL=[
  '#e03030','#e07820','#d4c820','#20d840','#00d8d8','#2858e0','#9018c0','#e018b8',
  '#ff6060','#ffa040','#ffe040','#50f080','#40f0f0','#5070f0','#b040e0','#f040d0',
  '#ff4040','#ff9030','#f0e030','#30e860','#20e8e8','#4068f8','#a028d8','#f828c8',
  '#e85050','#e89040','#e8e040','#40f070','#30f0f0','#5878f0','#b848e8','#f048d8',
];

// ── STATE ──
let SERIES = CONFIG.series.map(s=>({...s})); // live copy with excl state
let eliminated=[];
let phase='main';
let spinning=false;
let raf=null;
let angle=0;
let vel=0;
let speed=5;
let activeSegs=[];
let shelfPick=null;
let liveHL=null;
let hoveredSid=null;
let bookColors=[];

// ── SPEED ──
function setSpeed(v){speed=+v;document.getElementById('spdV').textContent=v;}
function initVel(){return 0.08+(speed-1)*(0.47/9);}
function decelRate(){return 0.988+(speed-1)*(0.008/9);}

// ── HELPERS ──
function getSeries(id){return SERIES.find(s=>s.id===id);}
function active(){return SERIES.filter(s=>!eliminated.includes(s.id)&&!s.excl);}

// ── SEGMENTS ──
function mainSegs(){
  const a=active();if(!a.length)return[];
  const sw=(Math.PI*2)/a.length;
  return a.map((s,i)=>({...s,sa:i*sw,sw,frac:1/a.length}));
}
function shelfSegs(){
  const picks=CONFIG.shelfPicks;
  const sw=(Math.PI*2)/picks.length;
  return picks.map((p,i)=>({
    id:'sp'+i, name:p.label,
    color:CONFIG.shelfPickColors[i]||'#8888ff',
    pickData:p, sa:i*sw, sw, frac:1/picks.length
  }));
}
function bookSegs(count){
  const sw=(Math.PI*2)/count;
  return Array.from({length:count},(_,i)=>({
    id:'b'+i, name:String(i+1),
    color:bookColors[i]||BOOK_PAL[i%BOOK_PAL.length],
    bookIdx:i, sa:i*sw, sw, frac:1/count
  }));
}

// ── DRAW ──
function draw(){
  const cv=document.getElementById('whl');
  const ctx=cv.getContext('2d');
  const cx=120,cy=120,r=118;
  ctx.clearRect(0,0,240,240);
  let segs;
  if(phase==='main')       segs=mainSegs();
  else if(phase==='shelf') segs=shelfSegs();
  else if(phase==='book')  segs=bookSegs(shelfPick.count);
  else segs=[];
  activeSegs=segs;
  if(!segs.length){ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fillStyle='#1a1a1a';ctx.fill();return;}
  segs.forEach(seg=>{
    const s=seg.sa-angle,e=s+seg.sw;
    ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,r,s,e);ctx.closePath();
    // Highlight slice if hovered globally
    if(!spinning && hoveredSid && phase==='main'){
      if(seg.id===hoveredSid){
        ctx.fillStyle=seg.color;ctx.fill();
        ctx.strokeStyle='rgba(255,255,255,.5)';ctx.lineWidth=2.5;ctx.stroke();
        ctx.save();ctx.globalAlpha=.25;ctx.fillStyle='#fff';ctx.fill();ctx.restore();
      } else {
        ctx.fillStyle=seg.color;ctx.fill();
        ctx.strokeStyle='rgba(0,0,0,.5)';ctx.lineWidth=1.5;ctx.stroke();
        ctx.save();ctx.globalAlpha=.5;ctx.fillStyle='#000';ctx.fill();ctx.restore();
      }
    } else {
      ctx.fillStyle=seg.color;ctx.fill();
      ctx.strokeStyle='rgba(0,0,0,.5)';ctx.lineWidth=1.5;ctx.stroke();
    }
    if(seg.frac>.022){
      const mid=s+seg.sw/2,tr=r*.63;
      ctx.save();
      ctx.translate(cx+Math.cos(mid)*tr,cy+Math.sin(mid)*tr);
      ctx.rotate(mid+Math.PI/2);
      ctx.fillStyle='rgba(255,255,255,.95)';
      const fs=seg.frac>.18?11:seg.frac>.1?9:7;
      ctx.font='600 '+fs+'px Inter,sans-serif';
      ctx.textAlign='center';ctx.textBaseline='middle';
      let lbl=seg.name;
      if(ctx.measureText(lbl).width>seg.frac*r*1.0){const p=lbl.split(' ');lbl=p.length>1?p[0]:lbl.slice(0,5)+'…';}
      // Draw label vertically (rotated 90 degrees so text runs along the slice)
      ctx.rotate(-Math.PI/2);
      ctx.fillText(lbl,0,0);
      // Strikethrough
      if(eliminated.includes(seg.id)){
        ctx.strokeStyle='rgba(255,255,255,.75)';
        ctx.lineWidth=1.5;
        const tw=Math.min(ctx.measureText(lbl).width+6, seg.frac*r*.9);
        ctx.beginPath();ctx.moveTo(-tw/2,0);ctx.lineTo(tw/2,0);ctx.stroke();
      }
      ctx.restore();
    }
  });
  // Strikethrough on eliminated segments (shown briefly as ghost)
  // We already removed them from active segs — instead draw ghost lines over full wheel
  // Actually we draw these before hub, over the existing colours isn't possible since
  // eliminated segs are gone. So we track and draw faded ghost slices first.
  // ── done via ghostSegs below ──

  // Hub with detail
  ctx.beginPath();ctx.arc(cx,cy,13,0,Math.PI*2);
  ctx.fillStyle='#1e2028';ctx.fill();
  ctx.strokeStyle='#4a5068';ctx.lineWidth=1.5;ctx.stroke();
  // Inner ring
  ctx.beginPath();ctx.arc(cx,cy,7,0,Math.PI*2);
  ctx.strokeStyle='#383d52';ctx.lineWidth=1;ctx.stroke();
  // Centre dot
  ctx.beginPath();ctx.arc(cx,cy,2.5,0,Math.PI*2);
  ctx.fillStyle='#5060a0';ctx.fill();
}

// ── HIT ──
function hitSeg(){
  const PI2=Math.PI*2;
  let a=((angle%PI2)+PI2)%PI2;
  for(const seg of activeSegs){
    const s=((seg.sa%PI2)+PI2)%PI2,e=s+seg.sw;
    if(e<=PI2){if(a>=s&&a<e)return seg;}
    else{if(a>=s||a<e-PI2)return seg;}
  }
  return activeSegs[0];
}

// ── SPIN ──
function spin(){
  const a=active();
  if(!a.length||spinning)return;
  if(phase==='main'&&a.length<=1)return;
  spinning=true;
  document.getElementById('spinBtn').disabled=true;
  flash('Spinning…','');
  clearBookGlow();
  if(phase==='shelf'||phase==='book'){
    document.querySelectorAll('.book').forEach(b=>{
      if(b.classList.contains('s-elim'))return;
      if(b.dataset.sid!=='none') b.classList.add('dimmed');
    });
  }
  vel=initVel()*.85+Math.random()*initVel()*.3;
  const dc=decelRate();
  function frame(){
    angle+=vel;vel*=dc;draw();
    if(phase==='main'){
      const h=hitSeg();
      if(h&&h.id!==liveHL){liveHL=h.id;shelfHighlightSeries(h.id,false);playTick(220+vel*800);}
    } else if(phase==='shelf'){
      const h=hitSeg();
      if(h&&h.id!==liveHL){liveHL=h.id;highlightShelfPick(h);playTick(260+vel*600);}
    } else if(phase==='book'){
      const h=hitSeg();
      if(h&&h.bookIdx!==undefined&&h.bookIdx!==liveHL){
        liveHL=h.bookIdx;shelfHighlightBook(shelfPick.shelfIdx,h.bookIdx,false);playTick(300+vel*500);
      }
    }
    if(vel>.0018){raf=requestAnimationFrame(frame);}
    else{
      spinning=false;liveHL=null;
      // Pointer bounce
      const ptr=document.querySelector('.ptr');
      ptr.classList.remove('bounce');
      void ptr.offsetWidth;
      ptr.classList.add('bounce');
      setTimeout(()=>ptr.classList.remove('bounce'),600);
      if(phase==='main')clearBookGlow();land(hitSeg());
    }
  }
  raf=requestAnimationFrame(frame);
}

    colourShelfBooks(shelfPick.shelfIdx,bookColors);
    glowShelf(shelfPick.shelfIdx);

function reSpinBook(){
  const btn=document.getElementById('spinBtn');
  btn.onclick=spin;btn.textContent='▶ Spin';
  document.querySelectorAll('.book[data-sid="shelf"]').forEach(b=>{
    b.classList.remove('winner','s-glow');b.classList.add('dimmed');
  });

  flash('Re-spinning…','');spin();
}
function enableSpin(){document.getElementById('spinBtn').disabled=false;}

// ── SHELF VISUALS ──
function shelfHighlightSeries(sid,final){
  document.querySelectorAll('.book').forEach(b=>{
    if(b.classList.contains('s-elim'))return;
    const bid=b.dataset.sid;
    if(bid===sid){
      // If goodreads book, switch to lit colour when glowing
      if(bid==='goodreads'&&b.dataset.litColor) b.style.backgroundColor=b.dataset.litColor;
      if(bid==='goodreads') b.querySelector('img')&&(b.querySelector('img').style.opacity='0.95');
      b.classList.add(final?'winner':'s-glow');
      b.classList.remove('dimmed');b.style.opacity='';
    } else {
      b.classList.remove('s-glow','winner');
      // Reset goodreads book to dark when not active
      if(bid==='goodreads') b.style.backgroundColor='#2a1010';
      if(bid==='goodreads') b.querySelector('img')&&(b.querySelector('img').style.opacity='0.35');
      if(bid!=='none') b.classList.add('dimmed');
      else b.style.opacity='';
    }
  });
}

function highlightShelfPick(seg){
  const shelves=document.querySelectorAll('.shelf');
  CONFIG.shelfPicks.forEach(p=>{
    const shelf=shelves[p.shelfIdx];
    if(!shelf)return;
    const isActive=seg.pickData&&seg.pickData.shelfIdx===p.shelfIdx;
    if(isActive){
      shelf.classList.add('shelf-glow');
      shelf.querySelectorAll('.book[data-sid="shelf"]').forEach(b=>{b.classList.add('s-glow');b.classList.remove('dimmed');});
    } else {
      shelf.classList.remove('shelf-glow');
      shelf.querySelectorAll('.book[data-sid="shelf"]').forEach(b=>{b.classList.remove('s-glow');b.classList.add('dimmed');});
    }
  });
}

function shelfHighlightBook(shelfIdx,bookIdx,final){
  if(shelfIdx===null)return;
  const shelf=document.querySelectorAll('.shelf')[shelfIdx];
  if(!shelf)return;
  const books=[...shelf.querySelectorAll('.book[data-sid="shelf"]')];
  books.forEach((b,i)=>{
    if(i===bookIdx){b.classList.add(final?'winner':'s-glow');b.classList.remove('dimmed');}
    else{b.classList.remove('s-glow','winner');b.classList.add('dimmed');}
  });
  // Sync zoom overlay
  // Sync zoom overlay
}

function clearBookGlow(){
  document.querySelectorAll('.book').forEach(b=>{
    b.classList.remove('s-glow','dimmed','winner');b.style.opacity='';
    if(b.dataset.sid==='goodreads') b.style.backgroundColor='#2a1010';
  });
  document.querySelectorAll('.shelf').forEach(s=>s.classList.remove('shelf-glow'));
}

function greyBooks(sid){
  document.querySelectorAll('.book[data-sid="'+sid+'"]').forEach(b=>{
    b.classList.add('s-elim');b.classList.remove('s-glow','dimmed','winner');
  });
}

function glowShelf(idx){
  const shelves=document.querySelectorAll('.shelf');
  if(shelves[idx])shelves[idx].classList.add('shelf-glow');
}

function colourShelfBooks(shelfIdx,colors){
  if(shelfIdx===null)return;
  const shelf=document.querySelectorAll('.shelf')[shelfIdx];
  if(!shelf)return;
  const books=[...shelf.querySelectorAll('.book[data-sid="shelf"]')];
  books.forEach((b,i)=>{b.style.backgroundColor=colors[i]||'#7a5030';});
}

// ── BUILD BOOKCASE ──
function buildBookcase(){
  const bc=document.getElementById('bookcase');
  bc.innerHTML='';
  let seed=42;
  function rand(min,max){seed=(seed*1664525+1013904223)&0xffffffff;return min+((seed>>>0)%(max-min+1));}

  CONFIG.shelves.forEach((groups,idx)=>{
    const shelf=document.createElement('div');
    shelf.className='shelf';
    const snum=document.createElement('span');
    snum.className='snum';snum.textContent=idx+1;
    shelf.appendChild(snum);
    const row=document.createElement('div');
    row.className='books-row';
    groups.forEach(g=>{
      for(let i=0;i<g.count;i++){
        const b=document.createElement('div');
        b.className='book';
        b.dataset.sid=g.id;
        let h,col;
        if(g.id==='none'){h=rand(38,58);col='#1e1e1e';}
        else if(g.id==='shelf'){h=rand(52,72);col='#7a5030';}
        else if(g.id==='goodreads'){h=rand(55,72);col='#2a1010';} // starts dark, glows when active
        else{h=rand(55,78);col=getSeries(g.id)?.color||'#555';}
        b.style.cssText='height:'+h+'px;flex:1;min-width:0;background:'+col;
        // Cross-panel hover for series books
        if(g.id!=='none'&&g.id!=='shelf'&&g.id!=='goodreads'){
          b.addEventListener('mouseenter',()=>{ if(!spinning) highlightSeriesGlobal(g.id); });
          b.addEventListener('mouseleave',()=>{ if(!spinning) clearHighlightGlobal(); });
        }
        // Store the lit colour for glow effect
        if(g.id==='goodreads') b.dataset.litColor=getSeries('goodreads')?.color||'#e84040';

// ── LEGEND ──
function renderLegend(){
  const list=document.getElementById('legend');
  list.innerHTML='';
  SERIES.forEach(s=>{
    const gone=eliminated.includes(s.id);
    const item=document.createElement('div');
    item.className='li'+(gone?' gone':s.excl?' excl':'');
    const tag=s.id==='shelf'?'shelves 6–8':s.id==='goodreads'?'#1–'+CONFIG.goodreadsCount:'';
    const tog=gone?'':`<label class="tog"><input type="checkbox" ${s.excl?'':'checked'} onchange="toggleExcl('${s.id}')"><span class="sldr"></span></label>`;
    item.innerHTML=`<span class="ldot" style="background:${s.color}"></span><span class="lname">${s.name}</span>${tag?`<span class="ltag">${tag}</span>`:''} ${tog}`;
    if(!gone&&s.id!=='shelf'&&s.id!=='goodreads'){
      item.addEventListener('mouseenter',()=>{ if(!spinning) highlightSeriesGlobal(s.id); });
      item.addEventListener('mouseleave',()=>{ if(!spinning) clearHighlightGlobal(); });
    }
    list.appendChild(item);
  });
}
function toggleExcl(id){const s=SERIES.find(x=>x.id===id);if(s)s.excl=!s.excl;draw();renderLegend();}

// ── UTILS ──
function flash(msg,cls){const f=document.getElementById('flash');f.textContent=msg;f.className='flash'+(cls?' '+cls:'');}
function setPhase(t){document.getElementById('phaseLbl').textContent=t;}
function logElim(name){
  document.getElementById('elimWrap').style.display='block';
  const e=document.createElement('div');e.className='eentry';
  e.textContent='#'+eliminated.length+' — '+name;
  document.getElementById('elog').prepend(e);
}

// ── RESET ──
function fullReset(){
  SERIES=CONFIG.series.map(s=>({...s}));
  eliminated=[];phase='main';angle=0;spinning=false;
  shelfPick=null;liveHL=null;bookColors=[];
  if(raf)cancelAnimationFrame(raf);
  const btn=document.getElementById('spinBtn');
  btn.disabled=false;btn.onclick=spin;btn.textContent='▶ Spin';
  setPhase('Series elimination');
  document.getElementById('elog').innerHTML='';
  document.getElementById('elimWrap').style.display='none';
  flash('Spin to begin','');
  document.querySelector('.left').style.background = '';
  document.getElementById('winnerBanner').style.display='none';
  const bg=document.getElementById('seriesBg');bg.style.opacity='0';bg.style.backgroundImage='';
  const vig=document.getElementById('seriesVignette');vig.style.opacity='0';
  stopConfetti();
  clearBookGlow();
  buildBookcase();
  renderLegend();
  draw();
}

// ── TOOLTIP ──
const tip = document.getElementById('bookTip');
document.addEventListener('mousemove', e=>{

  const b = e.target.closest('.book');
  if(b && b.dataset.sid && b.dataset.sid !== 'none' && !b.classList.contains('s-elim')){
    const sid = b.dataset.sid;
    let label = '';
    if(sid==='shelf') label='Shelf Pick';
    else if(sid==='goodreads') label='Goodreads Pick';
    else label = getSeries(sid)?.name || sid;
    // During book phase, show number too
    if(phase==='book' && b.dataset.bookNum) label = 'Book #'+b.dataset.bookNum;
    tip.textContent = label;
    tip.style.opacity = '1';
    tip.style.left = (e.clientX+12)+'px';
    tip.style.top  = (e.clientY-28)+'px';
  } else {
    tip.style.opacity='0';
  }
});
document.addEventListener('mouseleave',()=>{ tip.style.opacity='0'; });

// ── CONFETTI ──
let confettiActive = false;
let confettiColor = '#ffffff';
let confettiPieces = [];
let confettiRaf = null;

function launchConfetti(baseColor){
  confettiColor = baseColor;
  const cv=document.getElementById('confetti');
  cv.style.display='block';
  cv.width=window.innerWidth;cv.height=window.innerHeight;
  const ctx=cv.getContext('2d');
  const colors=[baseColor,'#ffffff',baseColor,'#ffffff',baseColor,'#ffe066',baseColor];

  // Initial burst
  confettiPieces = [];
  for(let i=0;i<140;i++){
    confettiPieces.push(makeBook(colors, cv.width, -10-Math.random()*300));
  }
  confettiActive = true;
  if(confettiRaf) cancelAnimationFrame(confettiRaf);

  function frame(){
    ctx.clearRect(0,0,cv.width,cv.height);
    // Trickle in new pieces sporadically
    if(confettiActive && Math.random()<0.25){
      confettiPieces.push(makeBook(colors, cv.width, -15));
    }
    confettiPieces = confettiPieces.filter(p=>{
      p.x+=p.vx; p.y+=p.vy; p.rot+=p.vr;
      p.vx += (Math.random()-0.5)*0.04;
      if(p.y > cv.height+20) return false;
      ctx.save();
      ctx.globalAlpha=p.alpha;
      ctx.translate(p.x,p.y);
      ctx.rotate(p.rot);
      const bw=p.w, bh=p.h;
      ctx.fillStyle='rgba(240,230,210,.9)';
      ctx.fillRect(-bw/2+2,-bh/2,bw-2,bh);
      ctx.fillStyle=p.color;
      ctx.fillRect(-bw/2,-bh/2,Math.max(3,bw*.35),bh);
      ctx.fillStyle='rgba(255,255,255,.15)';
      ctx.fillRect(-bw/2+Math.max(3,bw*.35),-bh/2,1,bh);
      ctx.restore();
      return true;
    });
    confettiRaf = requestAnimationFrame(frame);
  }
  confettiRaf = requestAnimationFrame(frame);
}

function makeBook(colors, maxW, startY){
  return {
    x: Math.random()*maxW,
    y: startY,
    w: 7+Math.random()*7, h: 10+Math.random()*8,
    color: colors[Math.floor(Math.random()*colors.length)],
    rot: Math.random()*Math.PI*2,
    vx: (Math.random()-0.5)*4, vy: 1.5+Math.random()*3.5,
    vr: (Math.random()-0.5)*0.2, alpha: 1
  };
}

function stopConfetti(){
  confettiActive = false;
  const cv=document.getElementById('confetti');
  // Let remaining pieces fall off then hide
  setTimeout(()=>{
    if(!confettiActive){
      if(confettiRaf) cancelAnimationFrame(confettiRaf);
      const ctx=cv.getContext('2d');
      ctx.clearRect(0,0,cv.width,cv.height);
      cv.style.display='none';
      confettiPieces=[];
    }
  }, 4000);
}



// ── DUST PARTICLES ──
(function(){
  const cv = document.getElementById('dust');
  if(!cv) return;
  const ctx = cv.getContext('2d');
  const particles = [];
  const NUM = 38;

  function resize(){
    cv.width = cv.offsetWidth;
    cv.height = cv.offsetHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  // Seed particles above the bookcase area
  for(let i=0;i<NUM;i++){
    particles.push(newParticle(true));
  }

  function newParticle(randomY){
    return {
      x: Math.random() * (cv.width||800),
      y: randomY ? Math.random() * (cv.height||400) : (cv.height||400) + 5,
      r: 0.4 + Math.random() * 1.1,
      vx: (Math.random()-0.5) * 0.18,
      vy: -(0.08 + Math.random() * 0.22),
      alpha: 0.08 + Math.random() * 0.28,
      flicker: Math.random() * Math.PI * 2,
      flickerSpeed: 0.01 + Math.random() * 0.025,
    };
  }

  function drawDust(){
    ctx.clearRect(0,0,cv.width,cv.height);
    particles.forEach((p,i)=>{
      p.x += p.vx + Math.sin(p.flicker)*0.06;
      p.y += p.vy;
      p.flicker += p.flickerSpeed;
      // Drift slightly
      p.vx += (Math.random()-0.5)*0.008;
      p.vx = Math.max(-0.3, Math.min(0.3, p.vx));

      const a = p.alpha * (0.7 + 0.3*Math.sin(p.flicker));
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
      ctx.fillStyle = 'rgba(220,210,190,'+a.toFixed(3)+')';
      ctx.fill();

      // Reset if floated off top
      if(p.y < -5) particles[i] = newParticle(false);
    });
    requestAnimationFrame(drawDust);
  }
  drawDust();
})();

// ── SOUND ──
let audioCtx = null;
function getAudio(){
  if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
  return audioCtx;
}

function playTick(pitch){
  try{
    const ctx = getAudio();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(pitch||280, ctx.currentTime);
    gain.gain.setValueAtTime(0.07, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+0.045);
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime+0.05);
  }catch(e){}
}

function playWin(){
  try{
    const ctx = getAudio();
    // Warm chord: root + major third + fifth
    [[523,0],[659,0.08],[784,0.16],[1047,0.28]].forEach(([freq,delay])=>{
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, ctx.currentTime+delay);
      gain.gain.setValueAtTime(0, ctx.currentTime+delay);
      gain.gain.linearRampToValueAtTime(0.12, ctx.currentTime+delay+0.04);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+delay+1.2);
      osc.start(ctx.currentTime+delay);
      osc.stop(ctx.currentTime+delay+1.3);
    });
  }catch(e){}
}

function playElim(){
  try{
    const ctx = getAudio();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(180, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(80, ctx.currentTime+0.18);
    gain.gain.setValueAtTime(0.08, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+0.22);
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime+0.25);
  }catch(e){}
}

// ── WOOD SHIMMER ──
(function(){
  const cv = document.getElementById('woodShimmer');
  if(!cv) return;
  let t = 0;
  function drawShimmer(){
    cv.width = cv.offsetWidth;
    cv.height = cv.offsetHeight;
    if(!cv.width||!cv.height){requestAnimationFrame(drawShimmer);return;}
    const ctx = cv.getContext('2d');
    ctx.clearRect(0,0,cv.width,cv.height);
    // Subtle moving light band
    const x = (Math.sin(t*0.0008)*0.5+0.5)*cv.width*1.4 - cv.width*0.2;
    const grad = ctx.createLinearGradient(x-60,0,x+60,0);
    grad.addColorStop(0,'rgba(255,220,140,0)');
    grad.addColorStop(0.5,'rgba(255,220,140,0.045)');
    grad.addColorStop(1,'rgba(255,220,140,0)');
    ctx.fillStyle=grad;
    ctx.fillRect(0,0,cv.width,cv.height);
    t++;
    requestAnimationFrame(drawShimmer);
  }
  drawShimmer();
})();

// ── HELPERS ──
function hexToRgb(hex){
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return isNaN(r)?null:{r,g,b};
}

// ── KEYBOARD SHORTCUTS ──
document.addEventListener('keydown', e=>{
  // Ignore if typing in an input
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA') return;
  switch(e.code){
    case 'Space':
      e.preventDefault();
      if(!document.getElementById('spinBtn').disabled) spin();
      break;
    case 'KeyR':
      e.preventDefault();
      fullReset();
      break;
    case 'KeyF':
      e.preventDefault();
      toggleFullscreen();
      break;
  }
});

(function(){
  function updateClock(){
    const now = new Date();
    const h = String(now.getHours()).padStart(2,'0');
    const m = String(now.getMinutes()).padStart(2,'0');
    const s = String(now.getSeconds()).padStart(2,'0');
    const el = document.getElementById('clock');
    if(el) el.textContent = h+':'+m+':'+s;
  }
  updateClock();
  setInterval(updateClock, 1000);
})();

// ── BOOKCASE SCALE ──
function scaleBookcase(val){
  const wrap = document.querySelector('.bookcase-wrap');
  if(wrap){
    // Scale the inner bookcase, not the wrapper, so wrapper width stays correct for centering
    const bc = wrap.querySelector('.bookcase');
    if(bc){
      bc.style.transform = 'scale('+val+')';
      bc.style.transformOrigin = 'top center';
      // Adjust wrapper height to match scaled bookcase so page doesn't collapse
      const naturalH = bc.scrollHeight;
      wrap.style.height = Math.round(naturalH * val) + 'px';
    }
  }
  document.getElementById('scaleVal').textContent = Math.round(val*100)+'%';
}

// ── GOOGLE SHEETS ──
async function fetchNextBook(seriesId){
  console.log('[Sheets] called for:', seriesId);
  const tabInfo = CONFIG.sheetsTabs[seriesId];
  if(!tabInfo){console.log('[Sheets] no tab info');return null;}
  if(!CONFIG.sheetsApiKey||CONFIG.sheetsApiKey===''){console.log('[Sheets] no key');return null;}
  try {
    const range = encodeURIComponent(tabInfo.tab+'!A:G');
    const url = 'https://sheets.googleapis.com/v4/spreadsheets/'+CONFIG.sheetId+'/values/'+range+'?key='+CONFIG.sheetsApiKey;
    console.log('[Sheets] fetching:', url);
    const res = await fetch(url);
    console.log('[Sheets] status:', res.status);
    if(!res.ok){const e=await res.text();console.log('[Sheets] error:',e);return null;}
    const data = await res.json();
    const rows = data.values||[];
    console.log('[Sheets] rows:', rows.length);
    const startRow = tabInfo.startRow || 1;
    for(let i=startRow;i<rows.length;i++){
      const row=rows[i];
      const readVal=(row[tabInfo.readCol]||'').toString().trim().toLowerCase();
      if(readVal!=='yes'){
        const title=row[tabInfo.titleCol]||null;
        console.log('[Sheets] next book row',i,':',title);
        return title;
      }
    }
    console.log('[Sheets] no unread book found');
    return null;
  } catch(e){console.log('[Sheets] exception:',e);return null;}
}

// ── WINNER POPUP ──
function showWinnerPopup(color, name){
  const popup = document.getElementById('winnerPopup');
  const inner = document.getElementById('winnerPopupInner');
  const popName = document.getElementById('popName');
  const rgb = hexToRgb(color);

  // Style it
  inner.style.borderColor = color;
  inner.style.background = rgb
    ? 'rgba('+Math.round(rgb.r*.15)+','+Math.round(rgb.g*.15)+','+Math.round(rgb.b*.15)+',.97)'
    : 'rgba(20,20,30,.97)';
  inner.style.color = color;
  inner.style.boxShadow = '0 0 80px rgba('+( rgb ? rgb.r+','+rgb.g+','+rgb.b : '255,255,255' )+',.25), 0 20px 60px rgba(0,0,0,.8)';
  popName.textContent = name;
  popName.style.color = '#e8e4d9';

  // Reset animation
  inner.classList.remove('shrinking');
  inner.style.animation = 'none';
  void inner.offsetWidth;
  inner.style.animation = '';

  popup.classList.add('active');

  // After 5 seconds shrink away
  setTimeout(()=>{
    inner.classList.add('shrinking');
    setTimeout(()=>{
      popup.classList.remove('active');
      inner.classList.remove('shrinking');
    }, 500);
  }, 5000);
}

// ── SERIES STATS ──
async function fetchSeriesStats(){
  const grid = document.getElementById('statsGrid');
  const tabs = CONFIG.sheetsTabs;
  const seriesOrder = ['swcanon','swlegends','asoiaf','tolkien','horus','fr','darkover','asimov','misc'];

  // Fetch all tabs in parallel
  const results = await Promise.all(seriesOrder.map(async id => {
    const tabInfo = tabs[id];
    if(!tabInfo) return {id, total:0, read:0};
    try {
      const range = encodeURIComponent(tabInfo.tab+'!A:G');
      const url = 'https://sheets.googleapis.com/v4/spreadsheets/'+CONFIG.sheetId+'/values/'+range+'?key='+CONFIG.sheetsApiKey;
      const res = await fetch(url);
      if(!res.ok) return {id, total:0, read:0};
      const data = await res.json();
      const rows = (data.values||[]).slice(1); // skip header
      // Count rows with a title in col A
      const withTitle = rows.filter(r => (r[tabInfo.titleCol]||'').trim() !== '');
      const readCount = withTitle.filter(r => (r[tabInfo.readCol]||'').toString().trim().toLowerCase() === 'yes').length;
      return {id, total: withTitle.length, read: readCount};
    } catch(e){ return {id, total:0, read:0}; }
  }));

  // Total books across all series for vertical bar proportions
  const grandTotal = results.reduce((s,r)=>s+r.total,0);

  // Build right panel series cards + vertical bar
  const spSeries = document.getElementById('spSeries');
  const spVertBar = document.getElementById('spVertBar');
  if(spSeries) spSeries.innerHTML='';
  if(spVertBar){
    spVertBar.innerHTML='';
    // Add unified unread background
    const unreadBg = document.createElement('div');
    unreadBg.className = 'sp-vert-bar-unread';
    spVertBar.appendChild(unreadBg);
  }

  results.forEach(({id, total, read}) => {
    const s = SERIES.find(x=>x.id===id);
    if(!s||total===0) return;
    const pct = (read/total*100);
    const readPct = (read/total*100);
    const heightPct = grandTotal>0?(total/grandTotal*100):0;

    // Right panel series card
    if(spSeries){
      const sc = document.createElement('div');
      sc.className = 'sp-series-card';
      sc.style.borderColor = s.color+'44';
      sc.innerHTML = `
        <div class="sp-series-name" style="color:${s.color}">${s.name}</div>
        <div class="sp-series-row">
          <div class="sp-series-count" style="color:${s.color}">${read}/${total}</div>
          <div class="sp-series-pct" style="color:${s.color}">${pct.toFixed(1)}%</div>
        </div>
        <div class="sp-bar-wrap"><div class="sp-bar" style="width:0%;background:${s.color}" data-width="${pct}%"></div></div>`;
      // Hover: highlight vertical bar segment
      sc.dataset.sid = id;
      sc.addEventListener('mouseenter',()=>{ highlightSeriesGlobal(id); });
      sc.addEventListener('mouseleave',()=>{ clearHighlightGlobal(); });
      spSeries.appendChild(sc);
    }

    // Vertical bar segment
    if(spVertBar){
      const hex = s.color;
      const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
      const darkCol = 'rgb('+Math.round(r*.18)+','+Math.round(g*.18)+','+Math.round(b*.18)+')';

      const seg = document.createElement('div');
      seg.className = 'sp-vert-segment';
      seg.dataset.sid = id;
      seg.style.cssText = 'height:'+heightPct+'%;position:relative;flex-shrink:0';
      // Unread (dark) base
      const unread = document.createElement('div');
      unread.className = 'unread-portion';
      unread.style.background = darkCol;
      // Read portion from top in series colour
      const readDiv = document.createElement('div');
      readDiv.className = 'read-portion';
      readDiv.style.cssText = 'background:'+s.color+';height:0%';
      readDiv.dataset.h = readPct+'%';
      seg.appendChild(unread);
      seg.appendChild(readDiv);
      spVertBar.appendChild(seg);
    }
  });

  // Add unified rest overlay (shows total completion as one bar)
  if(spVertBar){
    const grandRead = results.reduce((s,r)=>s+r.read,0);
    const overallPct = grandTotal>0?(grandRead/grandTotal*100):0;
    const restEl = document.createElement('div');
    restEl.className = 'sp-vert-bar-rest';
    restEl.dataset.h = overallPct+'%';
    restEl.style.height = '0%';
    spVertBar.appendChild(restEl);
    // Label sits in centre of whole bar, not inside rest overlay
    const restLabel = document.createElement('div');
    restLabel.className = 'sp-vert-bar-rest-label';
    restLabel.id = 'spVertRestLabel';
    restLabel.textContent = grandRead+' / '+grandTotal+' · '+overallPct.toFixed(1)+'%';
    spVertBar.appendChild(restLabel);
  }

  // Animate bars and vertical read portions
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    document.querySelectorAll('.sp-bar').forEach(b=>{ b.style.width=b.dataset.width; });
    document.querySelectorAll('.read-portion').forEach(b=>{ b.style.height=b.dataset.h; });
    // Animate unified rest bar
    const restEl = spVertBar&&spVertBar.querySelector('.sp-vert-bar-rest');
    if(restEl) restEl.style.height = restEl.dataset.h;
  }));
}

// ── CROSS-PANEL HIGHLIGHT ──
function highlightSeriesGlobal(sid){
  hoveredSid = sid;
  if(!spinning) draw();
  // Highlight books on shelf
  document.querySelectorAll('.book').forEach(b=>{
    if(b.classList.contains('s-elim')) return;
    if(b.dataset.sid===sid){
      b.classList.add('s-glow');
      b.classList.remove('dimmed');
    } else if(b.dataset.sid!=='none'){
      b.classList.remove('s-glow');
      b.classList.add('dimmed');
    }
  });
  // Highlight vertical bar segment
  const spVertBar = document.getElementById('spVertBar');
  if(spVertBar){
    spVertBar.classList.add('has-hover');
    spVertBar.querySelectorAll('.sp-vert-segment').forEach(seg=>{
      seg.classList.toggle('hovered', seg.dataset.sid===sid);
    });
  }
  // Highlight series cards
  const spSeries = document.getElementById('spSeries');
  if(spSeries){
    spSeries.querySelectorAll('.sp-series-card').forEach(sc=>{
      sc.style.opacity = sc.dataset.sid===sid ? '' : '.35';
    });
  }
}

function clearHighlightGlobal(){
  // Only clear if not spinning
  if(spinning) return;
  hoveredSid = null;
  draw();
  clearBookGlow();
  const spVertBar = document.getElementById('spVertBar');
  if(spVertBar){
    spVertBar.classList.remove('has-hover');
    spVertBar.querySelectorAll('.sp-vert-segment').forEach(s=>s.classList.remove('hovered'));
  }
  const spSeries = document.getElementById('spSeries');
  if(spSeries){
    spSeries.querySelectorAll('.sp-series-card').forEach(sc=>{ sc.style.opacity=''; });
  }
}

// ── WHEEL HOVER ──
(function(){
  const wc = document.getElementById('whl');
  if(!wc) return;
  wc.addEventListener('mousemove', e=>{
    if(spinning || phase!=='main') return;
    const rect = wc.getBoundingClientRect();
    const x = e.clientX - rect.left - rect.width/2;
    const y = e.clientY - rect.top - rect.height/2;
    const r = rect.width/2;
    if(Math.sqrt(x*x+y*y) > r){ clearHighlightGlobal(); return; }
    let a = Math.atan2(y, x);
    if(a < 0) a += Math.PI*2;
    const PI2 = Math.PI*2;
    for(const seg of activeSegs){
      const s=((seg.sa-angle)%PI2+PI2)%PI2;
      const e2=s+seg.sw;
      if(e2<=PI2){ if(a>=s&&a<e2){ if(hoveredSid!==seg.id) highlightSeriesGlobal(seg.id); return; }}
      else{ if(a>=s||a<e2-PI2){ if(hoveredSid!==seg.id) highlightSeriesGlobal(seg.id); return; }}
    }
    clearHighlightGlobal();
  });
  wc.addEventListener('mouseleave', ()=>{ if(!spinning) clearHighlightGlobal(); });
})();
